<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tests</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            max-width: 700px;
            margin: 24px auto;
            padding: 0 16px;
        }
        .pass {
            color: #14532d;
        }
        .fail {
            color: #b00020;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Tests</h1>
    <p id="Summary" role="status"></p>
    <ul id="results"></ul>

    <script type="module">

        import {
            patterns, validateTitle, validateDate, validateDuration, validateTag, isRealDate, normalizeTitle, validateRecord
        } from './Scripts/validator.js';
        import {
            escapeHtml, compileRegex, highlight 
        } from './Scripts/search.js';
        import {
            sortRecords
        } from './Scripts/state.js';
        import {
            computeStats, capStatus, validateCap, round2, toDateString, formatDuration
        } from './Scripts/stats.js';
        import {
            validateImport, recordsToJson
        } from './Scripts/portability.js';
        import {
            loadRecords, saveRecords, loadSettings, saveSettings
        } from './Scripts/storage.js';

        let passed = 0, failed = 0;
        const list = document.getElementById('results');

        function test(name, actual, expected) {
            const ok = actual === expected;
            ok ? passed++ : failed++;
            const li = document.createElement('li');
            li.className = ok ? 'pass' : 'fail';
            li.textContent = (ok ? 'PASS:' : 'FAIL') + name + (ok ? '' : ` (got ${actual}, expected ${expected})`);
            list.appendChild(li);
        }

        test('title: normal text ok', patterns.title.test('Study hard'), true);
        test('title: leading space rejected', patterns.title.test(' Study'), false);
        test('title: trailing space rejected', patterns.title.test('Study '), false);
        test('title: one character ok', patterns.title.test('A'), true);
        test('title: double spaces collapse', normalizeTitle('Study  for exam'), 'Study for exam');

        test('duration: 0 ok', patterns.duration.test('0'), true);
        test('duration: 90 ok', patterns.duration.test('90'), true);
        test('duration: 12.5 ok', patterns.duration.test('12.5'), true);
        test('duration: 007 rejected', patterns.duration.test('007'), false);
        test('duration: 1.234 rejected', patterns.duration.test('1.234'), false);
        test('duration: -5 rejected', patterns.duration.test('-5'), false);
        test('duration: letters rejected', patterns.duration.test('abc'), false);

        test('date: 2026-10-15 ok', patterns.date.test('2026-10-15'), true);
        test('date: month 13 rejected', patterns.date.test('2026-13-01'), false);
        test('date: wrong format rejected', patterns.date.test('15/10/2026'), false);
        test('date: Feb 30 passes the regex..', patterns.date.test('2026-02-30'), true);
        test('date: is not a real date', isRealDate('2024-02-30'), false);
        test('date: leap day 2024-02-29 is real', isRealDate('2024-02-29'), true);
        test('date: 2026-02-29 is not real', isRealDate('2026-02-29'), false);

        test('tag: School ok', patterns.tag.test('School'), true);
        test('tag: Part-time job ok', patterns.tag.test('Part-time job'), true);
        test('tag: digits rejected', patterns.tag.test('School2'), false);
        test('tag: leading hyphen rejected', patterns.tag.test('-School'), false);
        test('tag: double space rejected', patterns.tag.test('Study  Group'), false);

        test('duplicate: "the the" found', patterns.duplicateWord.test('Study the the exam'), true);
        test('duplicate: "The the" found (ignores case)', patterns.duplicateWord.test('The the exam'), true);
        test('duplicate: "the theory" Not found', patterns.duplicateWord.test('the theory exam'), false);
        test('duplicate: normal title not flagged', patterns.duplicateWord.test('Study for exam'), false);

        test('validateTitle: empty gives a message', validateTitle('') !== '', true);
        test('validateTitle: good title gives empty text', validateTitle('Study hard'), '');
        test('validateDuration: good', validateDuration('45'), '');
        test('validateDate: good', validateDate('2026-10-15'), '');
        test('validateTag: good', validateTag('School'), '');

        test('validateRecord: good form has no errors',
            Object.keys(validateRecord({ title: 'Study', date: '2026-10-15', duration: '90', tag: 'School'})).length, 0
        );
        test('validateRecord: bad form reports each bad field',
            Object.keys(validateRecord({ title: '', date: 'nope', duration: '007', tag: '1'})).length,4
        );

        test('escapeHtml: < and > are escaped', escapeHtml('<b>'), '&lt;b&gt;');
        test('compileRegex: empty box gives no regex', compileRegex('').re, null);
        test('compileRegex: good patterns works', compileRegex('^st').re instanceof RegExp, true);
        test('compileRegex: broken pattern gives an error, not a crash', compileRegex('[abc').error !== '', true);
        test('compileRegex: ignores case by default', compileRegex('study').re.test('STUDY'), true);
        test('compileRegex: case-sensitive when asked', compileRegex('study', true).re.test('STUDY'), false);
        test('highlight: wraps the match in <mark>', highlight('Study hard', /study/i), '<mark>Study</mark> hard');
        test('highlight: marks every match', highlight('a b a', /a/i), '<mark>a</mark> b <mark>a</mark>');
        test('highlight: escape HTML in the text', highlight('<b>x</b>', /x/i), '&lt;b&gt;<mark>x</mark>&lt;/b&gt;');
        test('highlight: no regex just escapes', highlight('<i>', null), '&lt;i&gt;');
        test('highlight: empty matches do not hang', highlight('abc', /x*/), 'abc');
         
        const sample = [
            {title: 'b', dueDate: '2026-02-01', duration: 10},
            {title: 'a', dueDate: '2026-03-01', duration: 30},
            {title: 'c', dueDate: '2026-01-01', duration: 20},
        ];

        test('sort: date oldest first', sortRecords(sample, 'date-asc').map((r) => r.title).join(''), 'cba');
        test('sort: date newest first', sortRecords(sample, 'date-desc').map((r) => r.title).join(''), 'abc');
        test('sort: title A-Z', sortRecords(sample, 'title-asc').map((r) => r.title).join(''), 'abc');
        test('sort: duration longest first', sortRecords(sample, 'duration-desc').map((r) => r.title).join(''), 'acb');
        test('sort: original list is not changed', sample[0].title, 'b');

        const rows = [
            {dueDate: '2026-10-18', duration: 30, tag: 'School'},
            {dueDate: '2026-10-18', duration:15.5, tag: 'school'},
            {dueDate: '2026-10-16', duration:60, tag: 'Health'},
            {dueDate: '2026-01-01', duration: 0.25, tag:'Health'}
        ]

        const today = new Date(2026, 9, 18);
        const stats = computeStats(rows, today);
        test('stats:total records', stats.totalRecords, 4);
        test('stats: total duration', stats.totalDuration, 105.75);
        test('stats: most used tag ignores capital letters', computeStats([
            {dueDate: '2026-10-10', duration: 5, tag:'School'},
            {dueDate: '2026-11-09', duration: 10, tag:'school'},
            {dueDate: '2026-10-20', duration: 5, tag:'Health'}
        ], today).topTag, 'School');
        test('stats: tie is settled alphabetically', computeStats([
            {dueDate: '2026-10-10', duration: 1, tag:'B'},
            {dueDate: '2026-10-18', duration: 5, tag:'A'}
        ], today).topTag, 'A');
        test('stats: no records gives None', computeStats([], today).topTag, 'None');
        test('stats: trend has 7 days', stats.trend.length, 7);
        test('stats: trend starts 6 days ago', stats.trend[0].date, '2026-10-12');
        test('stats: trend ends today', stats.trend[6].date, '2026-10-18');
        test('stats: trend adds up minutes for a day', stats.trend[6].minutes, 45.5);
        test('stats: trend day with nothing is 0', stats.trend[5].minutes, 0);
        test('stats: trend ignores old records', stats.trend.reduce((a, d) => a + d.minutes, 0), 105.5);
        test('round2: floating point fixed', round2(0.1 + 0.2), 0.3);
        test('toDateString: pads month and day', toDateString(new Date(2026, 0, 5)), '2026-01-05');

        test('cap: no cap gives null', capStatus(100, 0), null);
        test('cap: under is polite', capStatus(100, 600).level, 'polite');
        test('cap: under message', capStatus(100, 600).text, '500 minutes remaining of your 600 minute target.');
        test('cap: exactly at the cap is polite', capStatus(600, 600).level, 'polite');
        test('cap: over is assertive', capStatus(700, 600).level, 'assertive');
        test('cap: over message', capStatus(700.5, 600).text, 'Over your weekly target by 100.5 minutes!');
        test('validateCap: empty rejected', validateCap('') !==  '', true);
        test('validateCap: 600 ok', validateCap('600'), '');
        test('validateCap: 0 ok', validateCap('0'), '');
        test('validateCap: -5 rejected', validateCap('-5') !== '', true);
        test('validateCap: letters rejected', validateCap('abc') !== '', true);

        test('format: minutes', formatDuration(90, 'minutes'), '90 min');
        test('format: hours', formatDuration(90, 'hours'), '1.5h');
        test('format: default is minutes', formatDuration(45), '45min');
        test('cap in hours: polite text', capStatus(60, 600, 'hours').text, '9 hours remaining of your 10 hours target.');
        test('cap in hours: assertive text', capStatus(720, 600, 'hours').text, 'Over your weekly target by 2 hours!');

        const goodRecord = { id: 'rec_0001', title: 'Study', dueDate: '2026-10-15', duration: 90, tag: 'School', createdAt: '2026-10-01T08:00:00.000Z', updatedAt: '2026-10-01T08:00:00.000Z'};

        test('import: good file is accepted', validateImport([goodRecord]).errors.length, 0);
        test('import: good file gives records back', validateImport([goodRecord]).records.length, 1);
        test('import: empty file is fine', validateImport([]).errors.length, 0);
        test('import: not a list is rejected', validateImport({ a: 1 }).errors.length, 1);
        test('import: text is rejected', validateImport('hello').errors.length, 1);
        test('import: item that is not an object', validateImport([5]).errors.length, 1);
        test('import: missing field', validateImport([{ ...goodRecord, tag: undefined}]).errors.length > 0, true);
        test('import: duration as text is rejected', validateImport([{ ...goodRecord, duration: '90'}]).errors.length > 0, true);
        test('import: bad date is rejected', validateImport([{ ...goodRecord, dueDate:'2026-02-30'}]).errors.length > 0, true);
        test('import: regex rules apply to titles', validateImport([{ ...goodRecord, title: 'go go home'}]).errors.length > 0, true);
        test('import: bad timestamp is rejected', validateImport([{ ...goodRecord, createdAt: 'yesterday'}]).errors.length > 0, true);
        test('import: duplicate ids are rejected', validateImport([goodRecord, goodRecord]).errors.length > 0, true);
        test('import: one bad record rejects everything', validateImport([goodRecord, { ...goodRecord, id: 'rec_0002', tag: '1'}]).records.length, 0);
        test('import: extra fields are dropped', 'extra' in validateImport([{ ...goodRecord, extra: 1}]).records[0], false);
        test('export: JSON text can be read back', JSON.parse(recordsToJson([goodRecord]))[0].title, 'Study');

        saveRecords([goodRecord], 'test:records');
        test('storage: saved records load back', loadRecords('test:records')[0].id, 'rec_0001');
        test('storage: nothing saved gives null', loadRecords('test:missing'), null);
        localStorage.setItem('test:broken', '{oops');
        test('storage: broken text gives null, not a crash', loadRecords('test:broken'), null);
        test('storage: settings load back', (saveSettings({ unit: 'hours', cap: 600}, 'test:settings'), loadSettings('test:settings').unit), 'hours');
        test('storage: missing settings use defaults', loadSettings('test:missing').unit, 'minutes');
        test('storage: settings keep the cap', loadSettings('test:settings').cap, 600);
        test('storage: broken settings use defaults', loadSettings('test:broken').cap, 0);
        ['test:records', 'test:broken', 'test:settings'].forEach((key) => localStorage.removeItem(key));


        document.getElementById('Summary').textContent = `${passed} passed, ${failed} failed.`;
    </script>
    
</body>
</html>
